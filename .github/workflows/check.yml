# 型チェック → ビルド → CSPの取りこぼしチェック(npm run check)を、pushとPRのたびに回す。
# デプロイはCloudflare側のGitHub連携が別に行うので、ここが落ちても本番は止まらない(気づくための網)
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Cloudflareのビルドと同じバージョン(.node-version)で確認する
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
